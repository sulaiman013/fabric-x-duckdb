<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Tokens adopted from sulaimanahmed.dev so the demo sits inside the same brand.
   Sage-cream neutrals on hue 130-135, leaf-green accent on 140, portfolio radii.
   Strategy is Restrained: accent carries action and selection only, severity
   uses the portfolio's own destructive / warning / success roles.
   Single theme on purpose: an analyst works this queue for a full shift on a
   bank operations floor under bright overhead light, with a compliance manager
   reading the same screen alongside them. Every colour is painted explicitly so
   the page holds on either host ground. */
:root{
  --ground:      oklch(.975 .022 130);
  --surface:     oklch(.955 .028 130);
  --rail:        oklch(.97 .024 130);
  --sunken:      oklch(.94 .025 130);
  --ink:         oklch(.22 .025 135);
  --ink-2:       oklch(.48 .02 135);
  --ink-3:       oklch(.62 .015 135);
  --line:        oklch(.88 .02 130);
  --line-2:      oklch(.78 .022 130);
  --accent:      oklch(.58 .22 140);
  --accent-ink:  oklch(.98 .02 130);
  --accent-weak: oklch(.92 .07 140);
  --crit:        oklch(.50 .20 27);
  --crit-weak:   oklch(.945 .045 30);
  --warn:        oklch(.56 .14 72);
  --warn-weak:   oklch(.95 .06 80);
  --good:        oklch(.50 .16 145);
  --good-weak:   oklch(.93 .06 145);
  --focus:       oklch(.65 .2 140);
  --ease:        cubic-bezier(0.22,1,0.36,1);
  --r-xs:4px; --r-sm:6px; --r-md:10px; --r-lg:14px;
  --railw:224px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  font-variant-numeric:tabular-nums;font-feature-settings:"zero"1}
button{font:inherit;color:inherit;margin:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px;border-radius:3px}

.shell{display:grid;grid-template-columns:var(--railw) 1fr;min-height:100%}

/* rail: second neutral layer ---------------------------------------- */
.rail{background:var(--rail);border-right:1px solid var(--line);padding:13px 9px;
  display:flex;flex-direction:column;gap:1px;
  position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:baseline;gap:7px;padding:3px 9px 15px}
.brand b{font-size:14px;font-weight:600;letter-spacing:-.012em}
.brand span{font-size:10.5px;color:var(--ink-3);letter-spacing:.02em}
.grp{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  padding:15px 9px 5px;font-weight:600}
.nav{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;
  padding:6px 9px;border-radius:var(--r-sm);cursor:pointer;color:var(--ink-2);font-size:13px;
  transition:background 160ms var(--ease),color 160ms var(--ease)}
.nav:hover{background:var(--sunken);color:var(--ink)}
.nav:active{background:var(--line)}
.nav[aria-current="page"]{background:var(--accent-weak);color:var(--accent);font-weight:600}
.nav .ct{margin-left:auto;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.nav[aria-current="page"] .ct{color:var(--accent)}

.main{min-width:0;display:flex;flex-direction:column}

/* top bar ------------------------------------------------------------ */
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:11px 20px;
  border-bottom:1px solid var(--line);background:var(--surface)}
.top h1{margin:0;font-size:15px;font-weight:600;letter-spacing:-.012em}
.top p{margin:1px 0 0;font-size:11.5px;color:var(--ink-3)}
.spacer{flex:1}
.live{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-2)}
.beacon{width:6px;height:6px;border-radius:50%;background:var(--good);flex:none;
  box-shadow:0 0 0 3px var(--good-weak)}
/* instrument strip: label-leading, not a hero-metric row -------------- */
.strip{display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid var(--line);background:var(--surface)}
.inst{display:flex;align-items:baseline;gap:8px;padding:9px 18px;border-right:1px solid var(--line)}
.inst:last-child{border-right:0}
.inst dt{font-size:11px;color:var(--ink-3);white-space:nowrap}
.inst dd{margin:0;font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.inst dd.crit{color:var(--crit)} .inst dd.warn{color:var(--warn)} .inst dd.good{color:var(--good)}

.wrap{padding:16px 20px 36px;display:flex;flex-direction:column;gap:16px}

/* panels: borders only where they separate, no stacked cards ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.ph{display:flex;align-items:center;gap:11px;flex-wrap:wrap;padding:10px 15px;
  border-bottom:1px solid var(--line)}
.ph h2{margin:0;font-size:12.5px;font-weight:600}
.ph .note{font-size:11px;color:var(--ink-3)}
.seg{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.seg button{background:var(--surface);border:0;border-right:1px solid var(--line);
  padding:4px 11px;font-size:11.5px;color:var(--ink-2);cursor:pointer;
  transition:background 160ms var(--ease),color 160ms var(--ease)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--sunken);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}

.split{display:grid;grid-template-columns:minmax(0,1fr) 336px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{position:sticky;top:0;z-index:1;background:var(--rail);text-align:left;font-size:10.5px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;
  padding:7px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr{cursor:pointer;transition:background 140ms var(--ease)}
tbody tr:hover{background:var(--sunken)}
tbody tr[aria-selected="true"]{background:var(--accent-weak)}
tbody tr[aria-selected="true"] .aid{color:var(--accent);font-weight:600}

/* severity reads as a bounded chip, never an edge stripe */
.chip{display:inline-block;padding:1px 7px;border-radius:var(--r-xs);font-size:10px;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;border:1px solid transparent}
.chip.high{background:var(--crit-weak);color:var(--crit);border-color:var(--crit)}
.chip.med{background:var(--warn-weak);color:var(--warn);border-color:var(--warn)}
.chip.low{background:var(--sunken);color:var(--ink-3);border-color:var(--line-2)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:10.5px;font-weight:500;
  border:1px solid var(--line-2);color:var(--ink-2);background:var(--surface)}
.pill.open{border-color:var(--warn);color:var(--warn);background:var(--warn-weak)}
.pill.fraud{border-color:var(--crit);color:var(--crit);background:var(--crit-weak)}
.pill.fp{border-color:var(--good);color:var(--good);background:var(--good-weak)}
.pill.assigned{border-color:var(--accent);color:var(--accent);background:var(--accent-weak)}
.num{font-weight:600}
.num.high{color:var(--crit)} .num.med{color:var(--warn)} .num.low{color:var(--ink-2)}
.raw{color:var(--ink-3);font-size:11.5px}
.raw em{font-style:normal;opacity:.75}

/* detail --------------------------------------------------------------- */
.detail{border-left:1px solid var(--line);padding:14px 15px;display:flex;flex-direction:column;
  gap:13px;background:var(--surface);min-width:0}
.detail h3{margin:0;font-size:13px;font-weight:600}
.detail .sub{font-size:11px;color:var(--ink-3)}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:5px 10px;font-size:12px;margin:0}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;overflow-wrap:anywhere}
.rules{display:flex;flex-direction:column;gap:4px}
.rule{display:flex;align-items:center;gap:9px;font-size:11.5px;padding:5px 9px;
  border:1px solid var(--line);border-radius:var(--r-sm)}
.rule code{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--accent);font-weight:600}
.rule .w{margin-left:auto;color:var(--ink-3);font-size:10.5px;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.act{flex:1 1 92px;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);
  padding:7px 9px;font-size:12px;cursor:pointer;font-weight:500;
  transition:background 160ms var(--ease),border-color 160ms var(--ease)}
.act:hover:not(:disabled){background:var(--sunken)}
.act:active:not(:disabled){background:var(--line)}
.act:disabled{opacity:.42;cursor:not-allowed}
.act.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.act.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
.empty{padding:26px 14px;text-align:center;color:var(--ink-3);font-size:12px}
.empty b{display:block;color:var(--ink-2);font-size:12.5px;margin-bottom:3px;font-weight:600}

/* measures ------------------------------------------------------------- */
.bars{display:flex;flex-direction:column;gap:8px;padding:13px 15px}
.bar{display:grid;grid-template-columns:132px minmax(0,1fr) 70px;gap:11px;align-items:center;font-size:12px}
.track{background:var(--sunken);border-radius:2px;height:7px;overflow:hidden}
.fill{height:100%;border-radius:2px;background:var(--accent);display:block}
.fill.crit{background:var(--crit)} .fill.warn{background:var(--warn)}
.bar .n{text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
.flag{color:var(--warn);font-size:10px;font-weight:600}

.hist{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:9px;align-items:end;
  height:126px;padding:15px 15px 0}
.hcol{display:flex;flex-direction:column;justify-content:flex-end;gap:5px;min-width:0}
.hcol .v{font-size:10px;color:var(--ink-3);text-align:center;font-variant-numeric:tabular-nums}
.hcol .b{background:var(--accent);border-radius:2px 2px 0 0;min-height:2px}
.hx{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:9px;padding:6px 15px 14px}
.hx div{text-align:center;font-size:10px;color:var(--ink-3)}

.steps{padding:13px 15px;display:flex;flex-direction:column;gap:9px}
.step{display:grid;grid-template-columns:22px minmax(0,1fr);gap:11px;align-items:start;font-size:12px}
.step .i{width:22px;height:20px;border-radius:var(--r-xs);background:var(--sunken);color:var(--ink-2);
  display:grid;place-items:center;font-size:10px;font-weight:600;
  font-family:"JetBrains Mono",monospace}
.step b{display:block;font-size:12px;font-weight:600}
.step span{color:var(--ink-3);font-size:11.5px}

.callout{font-size:12px;color:var(--ink-2);background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-md);padding:11px 14px;line-height:1.55}
.callout b{color:var(--ink);font-weight:500;font-family:"Newsreader",Georgia,serif;font-style:italic;font-size:13.5px;letter-spacing:.005em}
.callout code{font-family:"JetBrains Mono",monospace;font-size:11px;
  background:var(--sunken);padding:1px 4px;border-radius:3px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important;animation:none!important}}
@media (max-width:1100px){ .split{grid-template-columns:1fr}
  .detail{border-left:0;border-top:1px solid var(--line)} }
@media (max-width:880px){ .cols2{grid-template-columns:1fr} }
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;overflow-x:auto;gap:3px;align-items:center;
    border-right:0;border-bottom:1px solid var(--line)}
  .brand,.grp{display:none}
  .nav{width:auto;white-space:nowrap}
  .wrap{padding:14px 16px 30px}
  .inst{padding:8px 14px}
}
</style>

<div class="shell">
  <nav class="rail" aria-label="Sections">
    <div class="brand"><b>Sentinel</b><span>Financial Crime</span></div>
    <div class="grp">Operate</div>
    <button class="nav" data-view="triage" aria-current="page">Alert triage <span class="ct" id="ct">10</span></button>

    <div class="grp">Analyse</div>

  <div class="main">
    <header class="top">
      <div><h1 id="vt">Alert triage</h1><p id="vs"></p></div>

    </header>
    <dl class="strip" id="strip"></dl>
    <div class="wrap" id="wrap"></div>
  </div>
</div>

<script>
/* Figures are measured from the real mirrored dataset: 50,000,000 rows of
   PostgreSQL landing data replicated into Fabric OneLake, profiled over a
   3,000,000 row sample. Alert rows are representative examples built from the
   real value distributions and real stored formats, not customer records. */
var REAL = {

         ruleFirings:65088689, anyRuleRate:80.18, firingsPerAlert:46.2, highRisk:1408756},

              [50,'3.5M','7.2%','46.0%',28],[60,'1.4M','2.85%','27.6%',11],[70,'441K','0.89%','12.6%',4]],
  medianAmt:88.87, p99Amt:2944.05,
  missing:[{k:'merchant_name',v:15.2},{k:'email',v:13.9},{k:'posting_date',v:5.2},{k:'txn_amount',v:1.3}],
  spell:[['addr_country',32],['txn_type',35],['card_brand',44],['merchant_category',56]],
  amt:[{b:'under 10',n:573674},{b:'10 to 50',n:667948},{b:'50 to 200',n:575243},
       {b:'200 to 1k',n:667641},{b:'1k to 5k',n:476280}],
  kyc:[['VERIFIED',751847,0],['PENDING',506364,0],['REJECTED',253423,0],

};
var RULES={R02:['Card not present',25],R03:['Amount anomaly vs customer',30],
  R04:['Odd-hour activity',15],R05:['Card velocity breach',30],
  R06:['First use of merchant',10],R07:['High-risk MCC',25],R09:['Declined-auth streak',20]};

var ALERTS=[
 {id:'ALT-88213',rid:7777777,txn:'TXN00000009368869',cust:'Nurul binti Hassan',mer:'PROOF-UPDATE-MERCHANT',raw:'424242.42',amt:424242.42,cur:'MYR',ch:'Mobile app',em:'ECOM',mcc:'5999',sc:92,r:['R03','R02','R05'],st:'open',dt:'18/09/2026 02:14'},

 {id:'ALT-88191',rid:33810227,txn:'TXN00000033810227',cust:'Siti binti Ibrahim',mer:'SHOPEE MOBILE MY',raw:'(45.00)',amt:-45,cur:'MYR',ch:'Internet banking',em:'KEYED',mcc:'5999',sc:74,r:['R02','R09'],st:'assigned',dt:'2026-09-17 21:08:44'},

var S={view:'triage',sel:'ALT-88213',filter:'all'};
var nf=new Intl.NumberFormat('en-MY');
var wrap=document.getElementById('wrap'), strip=document.getElementById('strip');

function esc(t){return String(t).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function money(a,c){ if(a===null) return 'not set';
  return (c==='MYR'?'RM ':c.toUpperCase()+' ')+new Intl.NumberFormat('en-MY',
    {minimumFractionDigits:2,maximumFractionDigits:2}).format(a); }
function band(s){return s>=70?'high':(s>=50?'med':'low');}
function statePill(s){var m={open:'Open',assigned:'Assigned',fraud:'Confirmed fraud',fp:'False positive'};
  return '<span class="pill '+s+'">'+m[s]+'</span>';}
function inst(k,v,cls){return '<div class="inst"><dt>'+k+'</dt><dd class="mono '+(cls||'')+'">'+v+'</dd></div>';}

function openAlerts(){return ALERTS.filter(function(a){return a.st==='open'||a.st==='assigned';});}
function shown(){return ALERTS.filter(function(a){
  if(S.filter==='all')return true;
  if(S.filter==='open')return a.st==='open'||a.st==='assigned';
  return band(a.sc)===S.filter;});}

/* views ------------------------------------------------------------- */
function triage(){
  var list=shown();
  var h='<section class="panel"><div class="ph"><h2>Alert queue</h2>'
   +'<span class="note">Score derived from named rules, not the source fraud_score column</span>'
   +'<div class="seg" role="group" aria-label="Filter alerts">'
   +seg('all','All')+seg('open','Open')+seg('high','High')+seg('med','Medium')+seg('low','Low')
   +'</div></div><div class="split"><div class="tw"><table>'
   +'<thead><tr><th scope="col">Alert</th><th scope="col">Sev</th><th scope="col">Score</th>'
   +'<th scope="col">Customer</th><th scope="col">Merchant</th><th scope="col">Amount</th>'
   +'<th scope="col">Stored as</th><th scope="col">Channel</th><th scope="col">Status</th></tr></thead><tbody>';
  if(!list.length){
    h+='<tr><td colspan="9"><div class="empty"><b>No alerts match this filter</b>'
      +'Clear the filter to see all '+ALERTS.length+' alerts in the queue.</div></td></tr>';
  }
  list.forEach(function(a){
    var b=band(a.sc);
    h+='<tr data-id="'+a.id+'" aria-selected="'+(S.sel===a.id)+'" tabindex="0">'
      +'<td class="mono aid">'+a.id+'</td>'
      +'<td><span class="chip '+b+'">'+b+'</span></td>'
      +'<td class="mono num '+b+'">'+a.sc+'</td>'
      +'<td>'+esc(a.cust)+'</td>'
      +'<td>'+esc(a.mer.trim()||'not set')+'</td>'
      +'<td class="mono">'+money(a.amt,a.cur)+'</td>'
      +'<td class="mono raw">'+(a.raw===''?'<em>empty string</em>':esc(a.raw))+'</td>'
      +'<td>'+esc(a.ch)+'</td><td>'+statePill(a.st)+'</td></tr>';
  });
  h+='</tbody></table></div>'+detail()+'</div></section>';
  h+='<div class="callout"><b>Why this table shows the stored value.</b> '
   +'The mirrored landing table is untyped by design, so an analyst sees the bytes exactly as PostgreSQL holds them: '
   +'<code>RM2576.57</code>, <code>(45.00)</code> for a credit, <code>1,204.00</code>, <code>N/A</code>, '
   +'padded whitespace, and an empty string. Across the full table, '+REAL.dateBad+'% of posting dates and '
   +REAL.amtBad+'% of amounts cannot be cast without cleaning. Hiding that from the person making the decision is how bad calls get made.</div>';
  return h;
}
function seg(v,l){return '<button type="button" data-filter="'+v+'" aria-pressed="'+(S.filter===v)+'">'+l+'</button>';}

function detail(){
  var a=ALERTS.filter(function(x){return x.id===S.sel;})[0];
  if(!a) return '<aside class="detail"><div class="empty"><b>No alert selected</b>'
    +'Choose a row to see the transaction, the rules that fired, and the actions available.</div></aside>';
  var closed=(a.st==='fraud'||a.st==='fp');
  var h='<aside class="detail" aria-label="Alert detail"><div>'
   +'<h3>'+esc(a.cust)+'</h3><div class="sub mono">'+a.id+' · '+a.txn+'</div></div>'
   +'<dl class="kv">'
   +'<dt>Amount</dt><dd class="mono">'+money(a.amt,a.cur)+'</dd>'
   +'<dt>Stored as</dt><dd class="mono raw">'+(a.raw===''?'<em>empty string</em>':esc(a.raw))+'</dd>'
   +'<dt>Merchant</dt><dd>'+esc(a.mer.trim()||'not set')+'</dd>'
   +'<dt>MCC</dt><dd class="mono">'+a.mcc+'</dd>'
   +'<dt>Channel</dt><dd>'+esc(a.ch)+', '+esc(a.em)+'</dd>'
   +'<dt>Posted</dt><dd class="mono raw">'+(a.dt===''?'<em>missing</em>':esc(a.dt))+'</dd>'
   +'<dt>Row id</dt><dd class="mono">'+a.rid+'</dd></dl>'
   +'<div><div class="grp" style="padding:0 0 6px">Rules fired, total '+a.sc+'</div><div class="rules">';
  a.r.forEach(function(k){h+='<div class="rule"><code>'+k+'</code>'+RULES[k][0]
    +'<span class="w">+'+RULES[k][1]+'</span></div>';});
  h+='</div></div><div class="acts">'
   +'<button class="act primary" type="button" data-act="fraud"'+(closed?' disabled':'')+'>Confirm fraud</button>'
   +'<button class="act" type="button" data-act="fp"'+(closed?' disabled':'')+'>False positive</button>'
   +'<button class="act" type="button" data-act="assigned"'+(closed?' disabled':'')+'>Assign to me</button></div>';
  if(closed) h+='<div class="sub">Disposed. Reopen from the case record.</div>';
  h+='</aside>';
  return h;
}

function cases(){
  var rows=[['DSP-00041288','Unauthorised','RM 2,576.57','Evidence requested','2d','breach in 3d','open'],
   ['DSP-00041205','Goods not received','RM 213.40','Under review','4d','breach in 1d','fraud'],
   ['DSP-00041199','Duplicate charge','RM 67.20','Chargeback filed','6d','on track','fp'],
   ['DSP-00041154','Fraud','RM 12,000.00','Raised','1d','on track','fp'],
   ['DSP-00041102','Amount incorrect','RM 54.90','Resolved','9d','closed','fp'],
   ['DSP-00041077','Unauthorised','RM 3,000.00','Under review','7d','breach in 2d','fraud'],
   ['DSP-00040996','Fraud','RM 424,242.42','Raised','0d','on track','fp']];
  var h='<section class="panel"><div class="ph"><h2>Dispute lifecycle</h2>'
   +'<span class="note">Raised, evidence requested, under review, chargeback filed, resolved</span></div>'
   +'<div class="tw"><table><thead><tr><th scope="col">Case</th><th scope="col">Reason</th>'
   +'<th scope="col">Value</th><th scope="col">State</th><th scope="col">Age</th>'
   +'<th scope="col">SLA</th></tr></thead><tbody>';
  rows.forEach(function(r){h+='<tr><td class="mono">'+r[0]+'</td><td>'+r[1]+'</td>'
    +'<td class="mono">'+r[2]+'</td><td>'+r[3]+'</td><td class="mono">'+r[4]+'</td>'
    +'<td><span class="pill '+r[6]+'">'+r[5]+'</span></td></tr>';});
  h+='</tbody></table></div></section>';
  return h;
}

function kyc(){
  var max=REAL.kyc[0][1];
  var h='<section class="panel"><div class="ph"><h2>Remediation worklist</h2>'
   +'<span class="note">Measured on a 3,000,000 row sample of the mirrored table</span></div><div class="bars">';
  REAL.kyc.forEach(function(k){
    var cls=k[2]?'warn':(k[0]==='VERIFIED'?'':'crit');
    h+='<div class="bar"><span class="mono">'+k[0]+(k[2]?' <span class="flag">VARIANT</span>':'')+'</span>'
      +'<span class="track"><span class="fill '+cls+'" style="width:'+Math.round(k[1]/max*100)+'%"></span></span>'
      +'<span class="n mono">'+nf.format(k[1])+'</span></div>';
  });
  h+='</div></section>';
  h+='<div class="callout"><b>The queue cannot be built until these statuses are conformed.</b> '
   +'A worklist filtered on <code>kyc_status = \'PENDING\'</code> silently misses the 251,386 customers stored as '
   +'<code>P</code>, and <code>VERIFIED</code> misses the 252,373 stored as <code>V</code>. '
   +'Eleven stored variants describe five real statuses. That is a compliance gap created by a data problem, '
   +'and it is the first thing the transformation layer has to fix.</div>';
  return h;
}

function quality(){
  var max=Math.max.apply(null,REAL.amt.map(function(x){return x.n;}));
  var h='<div class="cols2">';
  h+='<section class="panel"><div class="ph"><h2>Missing or null-like</h2>'
   +'<span class="note">NULL, empty, N/A, NA, unknown, none</span></div><div class="bars">';
  REAL.missing.forEach(function(m){
    var c=m.v>14?'crit':(m.v>4?'warn':'');
    h+='<div class="bar"><span class="mono">'+m.k+'</span><span class="track">'
      +'<span class="fill '+c+'" style="width:'+Math.min(100,m.v*5)+'%"></span></span>'
      +'<span class="n mono">'+m.v+'%</span></div>';});
  h+='</div></section>';
  h+='<section class="panel"><div class="ph"><h2>Competing spellings</h2>'
   +'<span class="note">Distinct stored values for one concept</span></div><div class="bars">';
  REAL.spell.forEach(function(p){
    h+='<div class="bar"><span class="mono">'+p[0]+'</span><span class="track">'
      +'<span class="fill warn" style="width:'+Math.min(100,p[1]*1.6)+'%"></span></span>'
      +'<span class="n mono">'+p[1]+'</span></div>';});
  h+='</div></section></div>';
  h+='<section class="panel"><div class="ph"><h2>Transaction amount distribution</h2>'
   +'<span class="note">Genuinely log-skewed. Median RM '+REAL.medianAmt+', p99 RM '+nf.format(REAL.p99Amt)+'</span></div>'
   +'<div class="hist">';
  REAL.amt.forEach(function(x){h+='<div class="hcol"><span class="v">'+nf.format(x.n)+'</span>'
    +'<span class="b" style="height:'+Math.round(x.n/max*92)+'px"></span></div>';});
  h+='</div><div class="hx">';
  REAL.amt.forEach(function(x){h+='<div class="mono">'+x.b+'</div>';});
  h+='</div></section>';
  h+='<div class="callout"><b>Not everything in this data carries signal.</b> '
   +'Amounts are genuinely skewed and merchant concentration is real, so both are safe to reason about. '
   +'Transaction counts per channel are close to uniform, so ranking channels by volume would be reading noise. '
   +'Charts here are limited to the measures that hold up.</div>';
  return h;
}

function pipeline(){
  var steps=[['01','PostgreSQL 16, on premises','landing.raw_txn, 50,000,000 rows, 101 columns, every business column TEXT'],
   ['02','Logical replication slot','wal_level=logical with test_decoding. A primary key on _mirror_row_id is what makes UPDATE and DELETE emit at all'],
   ['03','Change files','zstd Parquet with __rowMarker__ as the final column: 0 insert, 1 update, 2 delete'],
   ['04','Open mirroring landing zone','20-digit sequential filenames, uploaded over OneLake DFS, metadata written last so ingestion arms only once every file is complete'],
   ['05','Fabric replication engine','Applies inserts, updates and deletes to the Delta table'],
   ['06','Delta table in OneLake','_delta_log plus V-Order index, read back through delta_scan']];
  var h='<section class="panel"><div class="ph"><h2>Mirror pipeline</h2>'
   +'<span class="note">Seed once, then stream changes continuously</span></div><div class="steps">';
  steps.forEach(function(s){h+='<div class="step"><span class="i mono">'+s[0]+'</span>'
    +'<span><b>'+s[1]+'</b><span>'+s[2]+'</span></span></div>';});
  h+='</div></section>';
  h+='<section class="panel"><div class="ph"><h2>Proof this is a mirror, not a copy</h2>'
   +'<span class="note">Verified through delta_scan, which applies the transaction log</span></div>'
   +'<div class="tw"><table><thead><tr><th scope="col">Operation</th><th scope="col">Row</th>'
   +'<th scope="col">In PostgreSQL</th><th scope="col">In Fabric Delta</th><th scope="col">Result</th></tr></thead><tbody>'
   +'<tr><td>Insert</td><td class="mono">50000005</td><td>Created</td><td>Present</td><td><span class="pill fp">Applied</span></td></tr>'
   +'<tr><td>Update</td><td class="mono">7777777</td><td>AGODA.COM to PROOF-UPDATE-MERCHANT</td><td>PROOF-UPDATE-MERCHANT</td><td><span class="pill fp">Applied</span></td></tr>'
   +'<tr><td>Delete</td><td class="mono">3870726</td><td>Removed</td><td>Absent</td><td><span class="pill fp">Applied</span></td></tr>'
   +'</tbody></table></div></section>';
  h+='<div class="callout"><b>A copy cannot produce the last two rows.</b> '
   +'Appending files can only ever add records. Here the updated row changed in place and the deleted row disappeared, '
   +'both driven by the PostgreSQL write-ahead log. Live count after the changes: '
   +'50,000,000 seed, plus 1 insert, minus 1 delete, equals 50,000,000.</div>';
  var M=REAL.model;
  h+='<section class="panel"><div class="ph"><h2>Semantic model, verified by DAX over Direct Lake</h2>'
   +'<span class="note">Nothing imported. Reconciles to DuckDB on the same gold to the cent.</span></div><div class="bars">'
   +bar('Transactions',nf.format(M.txns),100,'')
   +bar('Alerts raised (score &ge; 60)',nf.format(M.alertsRaised),M.alertRate,'')
   +bar('Alert rate',M.alertRate+'%',M.alertRate,'')
   +bar('Analyst-years to clear',M.analystYears,28,'warn')
   +bar('Rule firings',nf.format(M.ruleFirings),100,'')
   +bar('Any-rule rate',M.anyRuleRate+'%',M.anyRuleRate,'crit')
   +bar('Rule firings per alert',M.firingsPerAlert,46,'')
   +'</div></section>';
  h+='<div class="callout"><b>The 80.18% figure was a modelling error, not a threshold to tune.</b> '
   +'An alert is what a human works; a rule firing is a contribution to a score. Counting every firing as an alert '
   +'implied 39.6 million alerts, roughly 317 full-time analysts. Alerting on the composite score gives 2.85%, '
   +'eleven analysts. The 80.18% is kept and labelled honestly as the any-rule rate.</div>';
  h+='<section class="panel"><div class="ph"><h2>Pricing the threshold</h2>'
   +'<span class="note">Simulated outcome label, 0.083% base rate. Trust the shape, not the absolute precision.</span></div>'
   +'<div class="tw"><table><thead><tr><th scope="col">Threshold</th><th scope="col">Alerts</th>'
   +'<th scope="col">Alert rate</th><th scope="col">Recall</th><th scope="col">FTE analysts</th></tr></thead><tbody>';
  REAL.thresholds.forEach(function(t){
    var sel=t[0]===60;
    h+='<tr'+(sel?' aria-selected="true"':'')+'><td class="mono aid">'+t[0]+'</td><td class="mono">'+t[1]+'</td>'
      +'<td class="mono">'+t[2]+'</td><td class="mono">'+t[3]+'</td><td class="mono num '+(t[4]>50?'high':(t[4]>20?'med':'low'))+'">'+t[4]+'</td></tr>';
  });
  h+='</tbody></table></div></section>';
  h+='<div class="callout"><b>There is no comfortable answer, which is the finding.</b> '
   +'Eleven analysts catch 27.6% of fraud. Catching 80% needs 106. Every row is a staffing decision at a real institution, '
   +'and it is why transaction monitoring runs at 90 to 95% false positives: the alternative is missing most of the fraud.</div>';
  return h;
}

function bar(label,val,pct,cls){
  return '<div class="bar"><span>'+label+'</span><span class="track"><span class="fill '+cls+'" style="width:'
    +Math.min(100,Math.max(2,pct))+'%"></span></span><span class="n mono">'+val+'</span></div>';
}

/* strip per view ----------------------------------------------------- */
function stripFor(v){
  if(v==='triage'){
    var open=openAlerts();
    var exp=open.reduce(function(s,a){return s+Math.abs(a.amt||0);},0);
    return inst('Open',open.length)
      +inst('High severity',ALERTS.filter(function(a){return a.sc>=70;}).length,'crit')
      +inst('Exposure','RM '+nf.format(Math.round(exp)),'warn')
      +inst('Mirror lag','~2 min','good')
      +inst('Rows mirrored',nf.format(REAL.rows));
  }
  if(v==='cases') return inst('Open cases',6)+inst('SLA at risk',3,'crit')
    +inst('In dispute','RM 442,154')+inst('Median age','4 days');
  if(v==='kyc') return inst('Outstanding',nf.format(1262769),'crit')
    +inst('Verified',nf.format(1004220))+inst('Stored variants','11','warn')
    +inst('Never reviewed',nf.format(251646),'crit');
  if(v==='quality') return inst('Dates unparseable',REAL.dateBad+'%','crit')
    +inst('Amounts unparseable',REAL.amtBad+'%','warn')
    +inst('Exact duplicates',nf.format(REAL.dupes),'warn')
    +inst('Median amount','RM '+REAL.medianAmt);
  return inst('Seed','10.5 GB')+inst('Ingested',nf.format(50000000),'good')
    +inst('CDC payload','29 KB','good')+inst('Latency','~2 min')
    +inst('Alert rate',REAL.model.alertRate+'%','good')+inst('Analysts',Math.round(REAL.model.analystYears/2.5));
}

var VIEWS={
  triage:['Alert triage','Ranked by derived risk score, highest first'],
  cases:['Dispute cases','Chargeback lifecycle against the regulatory clock'],
  kyc:['KYC remediation','Customers whose review is pending, rejected or never started'],
  quality:['Data trust','Profile of the mirrored landing table, measured not estimated'],
  pipeline:['Mirror and lineage','On-premises PostgreSQL to Fabric OneLake via open mirroring']
};
var BODY={triage:triage,cases:cases,kyc:kyc,quality:quality,pipeline:pipeline};

function render(){
  var v=VIEWS[S.view];
  document.getElementById('vt').textContent=v[0];
  document.getElementById('vs').textContent=v[1];
  strip.innerHTML=stripFor(S.view);
  wrap.innerHTML=BODY[S.view]();
  document.getElementById('ct').textContent=openAlerts().length;
}

document.querySelectorAll('.nav').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.nav').forEach(function(x){x.removeAttribute('aria-current');});
    b.setAttribute('aria-current','page');
    S.view=b.dataset.view; S.sel=(S.view==='triage'?S.sel:null); render();
  });
});
wrap.addEventListener('click',function(e){
  var f=e.target.closest('[data-filter]');
  if(f){S.filter=f.dataset.filter; render(); return;}
  var a=e.target.closest('.act');
  if(a && !a.disabled && S.sel){
    ALERTS.forEach(function(x){if(x.id===S.sel)x.st=a.dataset.act;});
    render(); return;
  }
  var tr=e.target.closest('tbody tr[data-id]');
  if(tr){S.sel=(S.sel===tr.dataset.id)?null:tr.dataset.id; render();}
});
wrap.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' ')return;
  var tr=e.target.closest('tbody tr[data-id]');
  if(tr){e.preventDefault(); S.sel=tr.dataset.id; render();}
});
render();
</script>
